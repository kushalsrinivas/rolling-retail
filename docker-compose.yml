# All-in-one for Dokploy or local dev: app + Postgres on port 3000.
#
#   docker compose up --build
#
# Dokploy alternative: deploy the Dockerfile alone and attach Dokploy's
# managed Postgres, then just set DATABASE_URL on the app service.
# Runtime secrets come from the environment (Dokploy: app env section);
# VITE_* below are build args — they bake into the browser bundle at build
# time, so changing them requires a rebuild. See .env.example for details.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rolling
      POSTGRES_PASSWORD: rolling
      POSTGRES_DB: rolling_retail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolling"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        VITE_WATERMARK_TEXT: ${VITE_WATERMARK_TEXT:-Food Truck Factory}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rolling:rolling@db:5432/rolling_retail
      DIRECT_URL: postgresql://rolling:rolling@db:5432/rolling_retail
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      RODIN_API_KEY: ${RODIN_API_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      FACTORY_DASHBOARD_TOKEN: ${FACTORY_DASHBOARD_TOKEN:-}
      SEED_DB: ${SEED_DB:-false}
    restart: unless-stopped

volumes:
  pgdata:
